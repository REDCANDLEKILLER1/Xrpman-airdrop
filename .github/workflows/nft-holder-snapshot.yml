name: NFT Holder Snapshot

on:
  push:
    branches:
      - agent/nft-holder-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public XRPL NFT data
        run: python tools/nft_snapshot.py
      - name: Resolve Three Legends diagnostics
        run: python tools/resolve_three_legends.py
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nft-holder-snapshot
          path: snapshot-output/
          if-no-files-found: warn
